<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Try Out Matematika Wajib TKA</title>
<style>
:root{--bg:#f3f6fc;--c:#fff;--t:#1b2233;--m:#5f6b85;--p:#2455d9;--pl:#e4ebff;--ok:#15803d;--okl:#dcfce7;--no:#b91c1c;--nol:#fee2e2;--b:#d6ddec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1320;--c:#172036;--t:#e8ecf6;--m:#9aa5c0;--p:#7e9dff;--pl:#212f58;--ok:#4ade80;--okl:#11331e;--no:#f87171;--nol:#3b1919;--b:#2a3552}}
:root[data-theme=dark]{--bg:#0e1320;--c:#172036;--t:#e8ecf6;--m:#9aa5c0;--p:#7e9dff;--pl:#212f58;--ok:#4ade80;--okl:#11331e;--no:#f87171;--nol:#3b1919;--b:#2a3552}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:16px/1.6 system-ui,'Segoe UI',Roboto,sans-serif}
.w{max-width:780px;margin:0 auto;padding:14px}.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px;margin-bottom:14px}
h1{margin:0;font-size:28px;line-height:1.2}h2{font-size:19px;margin:0 0 10px}.sub{color:var(--m);text-align:center;margin:4px 0}
.hero{background:linear-gradient(135deg,#2455d9,#0b2f86);color:#fff;border-radius:20px 20px 0 0;padding:26px 18px;text-align:center}.hero h1{color:#fff}.hero i{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:5px 14px;font-size:14px;font-style:normal;margin-bottom:12px}
.front{background:var(--c);border:1px solid var(--b);border-radius:0 0 20px 20px;padding:18px;margin-bottom:14px}.meta{display:flex;gap:14px;flex-wrap:wrap;font-weight:700;margin-bottom:8px}
label{display:block;font-weight:600;margin:12px 0 4px}input{width:100%;padding:11px 12px;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);font:inherit}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:600 16px system-ui;cursor:pointer}.btn.g{background:var(--pl);color:var(--p)}.btn:disabled{opacity:.4}[data-theme=dark] .btn,:root:not([data-theme=light]) .btn{color:#0b1020}
@media(prefers-color-scheme:light){.btn{color:#fff}}
.row{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}.chip{display:inline-block;background:var(--pl);color:var(--p);border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700}
table{width:100%;border-collapse:collapse;margin:8px 0}td,th{border:1px solid var(--b);padding:7px 8px;font-size:15px;text-align:left}th{background:var(--pl)}td.c,th.c{text-align:center;width:84px}
.scroll{overflow-x:auto}.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--b);border-radius:10px;padding:9px 12px;margin:8px 0;cursor:pointer}.opt.s{border-color:var(--p);background:var(--pl)}.opt input{width:auto;margin-top:6px}
.tm{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--p);color:#fff;border-radius:0 0 12px 12px;padding:8px 14px;display:flex;justify-content:space-between;font-weight:700;margin-bottom:12px}[data-theme=dark] .tm{color:#0b1020}
.bar{height:8px;background:var(--b);border-radius:8px;overflow:hidden;margin:8px 0 12px}.bar i{display:block;height:100%;background:var(--p)}
.nav{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.nav button{padding:7px 0;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;cursor:pointer;font:700 13px system-ui}.nav .d{background:var(--pl);border-color:var(--p)}.nav .cur{outline:2px solid var(--p)}
.sc{font-size:72px;font-weight:800;text-align:center;color:var(--p);line-height:1}.rv{border-left:5px solid var(--b)}.rv.ok{border-color:var(--ok)}.rv.no{border-color:var(--no)}
.key{background:var(--okl);border-radius:10px;padding:10px;margin:8px 0}.bad{background:var(--nol);border-radius:10px;padding:10px;margin:8px 0}.exp{background:var(--pl);border-radius:10px;padding:10px 12px;margin:8px 0}
.st{display:flex;gap:10px;margin:8px 0}.st b{flex:none;background:var(--p);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:13px}[data-theme=dark] .st b{color:#0b1020}
.tip{border-left:4px solid var(--p);padding:4px 10px;color:var(--m);margin:8px 0;font-size:15px}
.fig{text-align:center;margin:12px 0}.fig svg{max-width:100%;height:auto}svg text{fill:var(--t);font:13px system-ui,sans-serif}
@media print{.btn,.nav,.tm{display:none}}

<script>
const $=s=>document.querySelector(s),A=$('#app'),L='ABCDE',N=25,T0=4200;
const tb=(h,r)=>`<div class="scroll"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</table></div>`;
const TFH=['Benar','Salah'];
const FIG={10:'<svg viewBox="0 0 330 190" width="330"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="30" y="15" width="60" height="150"/><rect x="160" y="115" width="110" height="50"/></g><text x="2" y="95">15 cm</text><text x="46" y="183">6 cm</text><text x="146" y="112">D</text><text x="274" y="112">C</text><text x="146" y="178">A</text><text x="274" y="178">B</text><text x="198" y="184">10 cm</text><text x="132" y="144">AD = ?</text></svg>',
14:'<svg viewBox="0 0 340 190" width="340"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="20" y="15" width="55" height="135"/><polygon points="170,150 300,150 275,90 195,90"/></g><path d="M195 90V150" stroke="currentColor" stroke-dasharray="4" fill="none"/><text x="6" y="12">D</text><text x="78" y="12">C</text><text x="6" y="164">A</text><text x="78" y="164">B</text><text x="22" y="178">AB = 11 cm</text><text x="82" y="86">BC = 27 cm</text><text x="184" y="86">S</text><text x="278" y="86">R</text><text x="158" y="164">P</text><text x="304" y="164">Q</text><text x="192" y="164">T</text><text x="218" y="82">16 cm</text><text x="222" y="170">26 cm</text><text x="128" y="124">13 cm</text></svg>',
16:'<svg viewBox="0 0 270 190" width="300"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="30" y="70" width="140" height="80"/><path d="M30 70L80 35H220L170 70M220 35V115L170 150"/></g><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4"><path d="M30 150L80 115H220M80 115V35"/></g><path d="M80 35V115" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5" fill="none"/><text x="14" y="164">K</text><text x="172" y="166">L</text><text x="224" y="122">M</text><text x="62" y="126">N</text><text x="14" y="68">O</text><text x="172" y="66">P</text><text x="224" y="34">Q</text><text x="64" y="32">R</text><text x="70" y="180">KL = 6√2 cm</text><text x="196" y="150">LM = 4 cm</text><text x="228" y="80">MQ = 4 cm</text><text x="96" y="84" style="fill:#d97706">RN</text></svg>'};
const TOPIC={'Bilangan Bulat':'Bilangan negatif mengurangi: 5 + (−1) sama dengan 5 − 1 = 4. Pecahan campuran diubah dulu ke desimal agar mudah dijumlah, misalnya 2¼ = 2,25 dan 3½ = 3,5. Setelah dijumlah, bandingkan hasilnya satu per satu, jangan menebak.',
'Eksponen':'Perkalian pangkat dengan bilangan pokok sama: aᵐ × aⁿ = aᵐ⁺ⁿ. Pembagian: aᵐ ÷ aⁿ = aᵐ⁻ⁿ. Pangkat negatif berarti dibalik: a⁻ⁿ = 1/aⁿ. Kerjakan angkanya dulu, lalu huruf a, b, dan c satu per satu.',
'Sistem Persamaan Linear':'Misalkan harga barang dengan huruf, ubah cerita menjadi persamaan, lalu pakai eliminasi (samakan koefisien satu huruf lalu kurangkan) atau substitusi. Untuk pilihan ganda, memasukkan pilihan ke semua persamaan adalah cara cepat mengecek. Setelah ketemu, selalu cek ke persamaan awal.',
'Fungsi':'Komposisi (f ∘ g)(x) = f(g(x)): kerjakan g dulu, hasilnya dimasukkan ke f. Invers: tulis y = f(x), ubah menjadi x = ..., lalu tukar y menjadi x. Cek cepat: kalau f(a) = b maka f⁻¹(b) = a.',
'Barisan & Deret':'Aritmetika: Uₙ = a + (n − 1)b dan Sₙ = n/2 × (a + Uₙ). Geometri tak hingga: S = a/(1 − r) dengan syarat |r| < 1. Suku nomor ganjil (U₁, U₃, U₅, ...) membentuk deret geometri baru dengan rasio r².',
'Aritmetika Sosial':'Bunga tunggal dihitung dari modal awal saja: bunga = modal × persen × lama. Bunga tiap bulan selalu sama. Ingat satuan waktu: triwulan = 3 bulan, caturwulan = 4 bulan, semester = 6 bulan, 1 tahun = 12 bulan.',
'Kesebangunan':'Dua bangun sebangun punya sudut sama dan perbandingan sisi sepadan yang sama besar. Pasangkan dulu sisi yang sepadan (panjang dengan panjang, lebar dengan lebar), lalu buat perbandingan dan kali silang.',
'Geometri Datar':'Jarak dua titik: √((x₂ − x₁)² + (y₂ − y₁)²). Persegi panjang: keliling 2(p + l), luas p × l. Trapesium: luas = ½ × jumlah sisi sejajar × tinggi; tinggi dicari dengan Pythagoras dari kaki dan setengah selisih sisi sejajar.',
'Transformasi':'Translasi (a, b) menambah absis dengan a dan ordinat dengan b. Translasi beruntun = jumlahkan vektornya. Refleksi terhadap sumbu X: (x, y) menjadi (x, −y); terhadap sumbu Y: (x, y) menjadi (−x, y).',
'Dimensi Tiga':'Jarak dalam bangun ruang dicari dengan Pythagoras pada segitiga siku-siku. Jarak titik ke rusuk tegak sama dengan jarak di bidang alas ke kaki rusuk itu. Cara praktis: beri koordinat x, y, z lalu pakai rumus jarak.',
'Trigonometri':'Segitiga siku-siku: sin = depan/miring, cos = samping/miring, tan = depan/samping. Kebalikannya: cosec = 1/sin, sec = 1/cos, cot = 1/tan. Di kuadran II hanya sin yang positif. Cari sisi ketiga dengan Pythagoras.',
'Statistika':'Rata-rata = jumlah seluruh nilai ÷ banyak data. Data kelompok: tepi kelas = batas kelas ± 0,5. Kuartil: urutkan data, median membagi dua, Q₁ = median bagian bawah, Q₃ = median bagian atas, jangkauan antarkuartil = Q₃ − Q₁.',
'Peluang':'Peluang = banyak kejadian yang diinginkan ÷ banyak semua kemungkinan. Peluang bukan A = 1 − peluang A. Kombinasi C(n, r) dipakai jika urutan tidak penting; tanpa pengembalian berarti peluang kedua dihitung dari sisa yang ada.'};
const Q=[
{g:'Bilangan Bulat',q:'Fandi, Galih, Haris, Indra, dan Jaka mengikuti lomba dengan skor tiap sesi seperti tabel berikut.'+tb(['Nama','Sesi 1','Sesi 2','Sesi 3','Sesi 4','Sesi 5'],[['Fandi',5,3,-1,-1,2],['Galih',4,1,-2,2,4],['Haris',3,3,1,-3,1],['Indra',4,2,-1,-1,2],['Jaka',2,5,2,-1,3]])+'Berilah tanda centang pada kolom Benar atau Salah!',t:'tf',h:TFH,o:['Total skor Fandi lebih banyak dari Galih.','Total skor Fandi lebih banyak dari Indra.','Total skor Galih lebih banyak dari Indra.','Total skor Indra yang paling sedikit.','Jaka memenangkan permainan ini.'],a:[1,0,0,1,0],e:['Jumlahkan skor tiap anak (ingat bilangan negatif mengurangi): Fandi = 5+3−1−1+2 = 8; Galih = 4+1−2+2+4 = 9; Haris = 3+3+1−3+1 = 5; Indra = 4+2−1−1+2 = 6; Jaka = 2+5+2−1+3 = 11.','Pernyataan 1: 8 > 9? Tidak, jadi Salah. Pernyataan 2: 8 > 6, Benar. Pernyataan 3: 9 > 6, Benar.','Pernyataan 4: skor terkecil adalah Haris (5), bukan Indra (6), jadi Salah. Pernyataan 5: skor terbesar adalah Jaka (11), jadi Benar.']},
{g:'Bilangan Bulat',q:'Bu Fika membeli 2¼ kg tepung terigu dan 3¼ kg tepung tapioka. Bu Andini membeli 4,25 kg terigu dan 2,5 kg tapioka. Bu Rima membeli 3¼ kg terigu dan 1,5 kg tapioka. Bu Lintang membeli 3½ kg terigu dan 3,5 kg tapioka. Pernyataan yang benar adalah ....',t:'mc',o:['Total berat belanjaan Bu Fika adalah 6,25 kg.','Total berat belanjaan Bu Rima adalah 6,5 kg.','Total berat belanjaan Bu Lintang adalah 7,25 kg.','Total belanjaan Bu Andini paling ringan.','Total belanjaan Bu Lintang paling berat.'],a:4,e:['Ubah semua ke desimal: 2¼ = 2,25; 3¼ = 3,25; 3½ = 3,5.','Fika = 2,25 + 3,25 = 5,5 kg. Andini = 4,25 + 2,5 = 6,75 kg. Rima = 3,25 + 1,5 = 4,75 kg. Lintang = 3,5 + 3,5 = 7 kg.','Bandingkan: yang terberat Bu Lintang (7 kg), yang teringan Bu Rima (4,75 kg). Pilihan A, B, C salah karena angkanya tidak cocok, D salah karena yang teringan Bu Rima.']},
{g:'Eksponen',q:'Bentuk sederhana dari (2a⁴b⁻³c¹²)/(10a³b⁹c¹⁰) × (15bc⁴)/a⁶ adalah ....',t:'mc',o:['3c²/(2a⁵b¹¹)','3ac⁵/(a⁶b¹⁴)','3c²/(a⁵b¹²)','3c⁶/(a⁵b¹¹)','6ac⁶/(a⁵b¹¹)'],a:3,e:['Kalikan angka dan pangkatnya per huruf. Angka: (2 × 15)/10 = 3.','Huruf a: pangkat atas 4, bawah 3 + 6 = 9, jadi a^(4−9) = a⁻⁵ (artinya a⁵ di penyebut).','Huruf b: atas −3 + 1 = −2, bawah 9, jadi b^(−2−9) = b⁻¹¹ (b¹¹ di penyebut). Huruf c: atas 12 + 4 = 16, bawah 10, jadi c⁶ di pembilang.','Hasil: 3c⁶/(a⁵b¹¹).']},
{g:'Sistem Persamaan Linear',q:'Niken membeli 3 buku tulis dan 1 pensil dengan membayar Rp33.000,00. Sinta membeli 2 buku tulis dan 3 pensil dengan membayar Rp29.000,00. Berilah tanda centang pada kolom Benar atau Salah!',t:'tf',h:TFH,o:['Harga 3 buku tulis adalah Rp30.000,00.','Harga 4 buku tulis adalah Rp48.000,00.','Harga 3 pensil adalah Rp9.000,00.','Harga 4 pensil adalah Rp12.000,00.','Harga 2 buku tulis dan 5 pensil adalah Rp30.000,00.'],a:[0,1,0,0,1],e:['Misalkan buku = b dan pensil = p. Persamaannya: 3b + p = 33.000 dan 2b + 3p = 29.000.','Kalikan persamaan pertama dengan 3: 9b + 3p = 99.000. Kurangkan dengan persamaan kedua: 7b = 70.000, maka b = 10.000. Lalu p = 33.000 − 30.000 = 3.000.','Cek: 3 buku = 30.000 (Benar); 4 buku = 40.000, bukan 48.000 (Salah); 3 pensil = 9.000 (Benar); 4 pensil = 12.000 (Benar); 2 buku + 5 pensil = 20.000 + 15.000 = 35.000, bukan 30.000 (Salah).']},
{g:'Sistem Persamaan Linear',q:'Sistem persamaan linear 4x + y + z = 14; 2x + 3y + 2z = 11; x + 2y + 3z = 8 memiliki penyelesaian ....',t:'mc',o:['x = 1, y = 1, dan z = 3','x = 1, y = −1, dan z = 3','x = 3, y = −1, dan z = 1','x = 3, y = 1, dan z = 1','x = 3, y = 2, dan z = 1'],a:3,e:['Cara cepat untuk pilihan ganda: masukkan pilihan ke ketiga persamaan.','Coba D (x=3, y=1, z=1): persamaan 1 → 12 + 1 + 1 = 14 ✓. Persamaan 2 → 6 + 3 + 2 = 11 ✓. Persamaan 3 → 3 + 2 + 3 = 8 ✓.','Pilihan C gagal di persamaan 1 (12 − 1 + 1 = 12, bukan 14), dan E gagal di persamaan 2. Jadi jawabannya D.']},
{g:'Fungsi',q:'Jika invers dari fungsi f(x) = (4 + x)/(2 − 2x) adalah f⁻¹(x), nilai f⁻¹(2) adalah ....',t:'mc',o:['−1/4','−1/2','0','1/4','1/2'],a:2,e:['Cari invers: tulis y = (4 + x)/(2 − 2x), kali silang: 2y − 2xy = 4 + x.','Kumpulkan x: 2y − 4 = x + 2xy = x(1 + 2y), sehingga x = (2y − 4)/(2y + 1).','Jadi f⁻¹(x) = (2x − 4)/(2x + 1). Masukkan x = 2: (4 − 4)/(4 + 1) = 0/5 = 0.']},
{g:'Fungsi',q:'Diketahui f(x) = 5x − 8 dan g(x) = 11 − x. Berilah tanda centang pada kolom Benar atau Salah!',t:'tf',h:TFH,o:['(f ∘ g)(x) = −5x + 48','(f ∘ g)(0) = 47','(f ∘ g)(1) = 45'],a:[1,0,1],e:['(f ∘ g)(x) artinya f(g(x)): ganti x pada f dengan g(x). f(g(x)) = 5(11 − x) − 8 = 55 − 5x − 8 = 47 − 5x.','Pernyataan 1: hasilnya −5x + 47, bukan +48 → Salah.','Pernyataan 2: x = 0 → 47 − 0 = 47 → Benar. Pernyataan 3: x = 1 → 47 − 5 = 42, bukan 45 → Salah.']},
{g:'Barisan & Deret',q:'Suatu deret aritmetika memiliki suku terakhir 35. Jumlah keseluruhan suku-sukunya adalah 125. Suku pertama deret tersebut −10. Berilah tanda centang pada kolom Benar atau Salah!',t:'tf',h:TFH,o:['Banyak suku ada 12.','Beda deret adalah 5.','Suku kedua adalah 5.','Suku keempat adalah 5.','Suku kelima adalah 15.'],a:[1,0,1,0,1],e:['Gunakan Sn = n/2 × (a + Un): 125 = n/2 × (−10 + 35) = n/2 × 25, sehingga n = 10 (bukan 12).','Cari beda: Un = a + (n − 1)b → 35 = −10 + 9b → 9b = 45 → b = 5.','Tulis suku-sukunya: −10, −5, 0, 5, 10, ... Suku ke-2 = −5 (bukan 5), suku ke-4 = 5 ✓, suku ke-5 = 10 (bukan 15).']},
{g:'Barisan & Deret',q:'Jumlah suku-suku nomor ganjil suatu deret geometri tak hingga adalah 4. Rasio deret tersebut adalah 1/2. Maka deret tersebut adalah ....',t:'mc',o:['3 + 3/4 + 3/16 + ...','3 + 3/2 + 3/4 + ...','3/8 + 3/4 + 3/2 + ...','3/6 + 3/8 + 3/12 + ...','3/2 + 3/4 + 3/6 + ...'],a:1,e:['Suku-suku nomor ganjil: U₁, U₃, U₅, ... membentuk deret geometri baru dengan suku pertama a dan rasio r² = (1/2)² = 1/4.','Jumlah tak hingga: S = a/(1 − r²) → 4 = a/(1 − 1/4) = a/(3/4) = 4a/3, sehingga a = 3.','Deret aslinya: suku pertama 3, rasio 1/2 → 3 + 3/2 + 3/4 + ... Jawaban B.']},
{g:'Aritmetika Sosial',q:'Modal sebesar Rp2.000.000,00 dipinjamkan dengan suku bunga tunggal 1% per bulan. Berilah tanda centang pada kolom Benar atau Salah!',t:'tf',h:TFH,o:['Besar uang setelah 1 triwulan adalah Rp2.040.000,00.','Besar uang setelah 1 caturwulan adalah Rp2.080.000,00.','Besar uang setelah 1 semester adalah Rp2.120.000,00.','Besar uang setelah 1 tahun adalah Rp2.160.000,00.','Besar uang setelah 2 tahun adalah Rp2.480.000,00.'],a:[1,0,0,1,0],e:['Bunga tunggal per bulan = 1% × 2.000.000 = Rp20.000. Triwulan = 3 bulan, caturwulan = 4 bulan, semester = 6 bulan.','Triwulan: 2.000.000 + 3 × 20.000 = 2.060.000 (bukan 2.040.000) → Salah. Caturwulan: + 80.000 = 2.080.000 → Benar. Semester: + 120.000 = 2.120.000 → Benar.','Satu tahun (12 bulan): + 240.000 = 2.240.000 (bukan 2.160.000) → Salah. Dua tahun (24 bulan): + 480.000 = 2.480.000 → Benar.']},
{g:'Kesebangunan',q:'Dua bangun datar sebangun. Bangun pertama persegi panjang berukuran 15 cm × 6 cm. Bangun kedua persegi panjang ABCD dengan AB = 10 cm (sisi panjang). Panjang AD adalah ... cm.',t:'mc',o:['2','2,5','4','4,25','5'],a:2,e:['Bangun sebangun punya perbandingan sisi yang sama. Sisi panjang 15 cm sepadan dengan AB = 10 cm, sisi pendek 6 cm sepadan dengan AD.','Tulis perbandingan: AD/6 = 10/15.','AD = 6 × 10/15 = 60/15 = 4 cm.']},
{g:'Geometri Datar',q:'Diketahui titik A(1, 2), B(3, 1), C(6, 6), dan D(6, 8). Berilah tanda centang pada kolom Benar atau Salah!',t:'tf',h:TFH,o:['Jarak titik A ke titik B adalah √3 satuan.','Jarak titik A ke titik C adalah √41 satuan.','Jarak titik B ke titik C adalah √34 satuan.','Jarak titik B ke titik D adalah √57 satuan.','Jarak titik A ke titik D adalah √37 satuan.'],a:[1,0,0,1,1],e:['Rumus jarak dua titik: d = √((x₂ − x₁)² + (y₂ − y₁)²).','AB = √(2² + (−1)²) = √5 (bukan √3) → Salah. AC = √(5² + 4²) = √41 → Benar. BC = √(3² + 5²) = √34 → Benar.','BD = √(3² + 7²) = √58 (bukan √57) → Salah. AD = √(5² + 6²) = √61 (bukan √37) → Salah.']},
{g:'Transformasi',q:'Segilima ABCDE dengan A(−8, 2), B(−6, −1), C(1, 2), D(3, 5), E(2, 10) direfleksikan terhadap sumbu X. Berilah tanda centang pada kolom Benar atau Salah!',t:'tf',h:TFH,o:['Hasil refleksi titik A adalah (−8, −2).','Hasil refleksi titik B adalah (−6, 1).','Hasil refleksi titik C adalah (2, 1).','Hasil refleksi titik D adalah (3, −5).','Hasil refleksi titik E adalah (10, 2).'],a:[0,0,1,0,1],e:['Aturan refleksi terhadap sumbu X: (x, y) menjadi (x, −y). Absis tetap, ordinat berubah tanda.','A(−8, 2) → (−8, −2) ✓. B(−6, −1) → (−6, 1) ✓. C(1, 2) → (1, −2), bukan (2, 1) ✗.','D(3, 5) → (3, −5) ✓. E(2, 10) → (2, −10), bukan (10, 2) ✗.']},
{g:'Transformasi',q:'Titik H(7, −10) ditranslasikan oleh T₁ = (6, 2), dilanjutkan dengan T₂ = (−4, −1). Koordinat hasil transformasinya adalah ....',t:'mc',o:['(8, −9)','(8, −8)','(9, −6)','(9, −9)','(9, −8)'],a:3,e:['Translasi beruntun = jumlahkan vektornya: T₁ + T₂ = (6 − 4, 2 − 1) = (2, 1).','Tambahkan ke titik H: (7 + 2, −10 + 1) = (9, −9).']},
{g:'Geometri Datar',q:'Persegi panjang ABCD memiliki AB = 11 cm dan BC = 27 cm. Trapesium sama kaki PQRS memiliki sisi sejajar PQ = 26 cm dan SR = 16 cm, serta kaki 13 cm. Berilah tanda centang pada kolom Benar atau Salah!',t:'tf',h:TFH,o:['Keliling bangun ABCD adalah 38 cm.','Luas bangun ABCD adalah 297 cm².','Tinggi trapesium PQRS adalah 12 cm.','Keliling bangun PQRS adalah 78 cm.','Luas bangun PQRS adalah 252 cm².'],a:[1,0,0,1,0],e:['ABCD: keliling = 2 × (11 + 27) = 76 cm (bukan 38) → Salah. Luas = 11 × 27 = 297 cm² → Benar.','Tinggi trapesium: selisih sisi sejajar = 26 − 16 = 10, tiap sisi samping 5 cm. Dengan Pythagoras: t = √(13² − 5²) = √144 = 12 cm → Benar.','Keliling PQRS = 26 + 16 + 13 + 13 = 68 cm (bukan 78) → Salah. Luas = ½ × (26 + 16) × 12 = 252 cm² → Benar.']},
{g:'Dimensi Tiga',q:'Diketahui kubus ABCD.EFGH dengan panjang sisi 12 cm. Titik O terletak di tengah rusuk AE. Jarak titik G ke titik O adalah ... cm.',t:'mc',o:['9√2','18','18√2','18√3','24'],a:1,e:['Beri koordinat: A(0,0,0), B(12,0,0), D(0,12,0), E(0,0,12). Maka G(12,12,12) dan O tengah AE = (0,0,6).','Jarak GO = √(12² + 12² + 6²) = √(144 + 144 + 36) = √324.','√324 = 18 cm.']},
{g:'Dimensi Tiga',q:'Balok KLMN.OPQR memiliki alas KLMN dan tutup OPQR (rusuk tegak KO, LP, MQ, NR). Panjang KL = 6√2 cm, LM = 4 cm, dan MQ = 4 cm. Jarak titik L ke rusuk RN adalah ... cm.',t:'mc',o:['2√11','2√22','3√11','3√22','4√11'],a:1,e:['Rusuk RN adalah rusuk tegak (tegak lurus alas). Jadi jarak L ke RN sama dengan jarak L ke titik N di alas (kaki tegak lurusnya).','Di alas, LN adalah diagonal persegi panjang KLMN: LN = √(KL² + KN²) = √((6√2)² + 4²) = √(72 + 16) = √88.','√88 = √(4 × 22) = 2√22 cm. (Tinggi balok 4 cm tidak dipakai.)']},
{g:'Trigonometri',q:'Segitiga ABC siku-siku di B dengan AB = 4 cm dan BC = 2 cm. Berilah tanda centang pada kolom Setuju atau Tidak Setuju!',t:'tf',h:['Setuju','Tidak Setuju'],o:['Nilai sin A adalah √5/5.','Nilai cos A adalah √5/10.','Nilai sec A adalah √5/2.','Nilai cosec A adalah √5/5.','Nilai tan A adalah 1/2.'],a:[0,1,0,1,0],e:['Hitung sisi miring: AC = √(4² + 2²) = √20 = 2√5. Dari sudut A: depan = BC = 2, samping = AB = 4, miring = 2√5.','sin A = 2/(2√5) = 1/√5 = √5/5 ✓. cos A = 4/(2√5) = 2/√5 = 2√5/5 (bukan √5/10) ✗.','sec A = 1/cos A = √5/2 ✓. cosec A = 1/sin A = √5 (bukan √5/5) ✗. tan A = 2/4 = 1/2 ✓.']},
{g:'Trigonometri',q:'Diketahui sin A = 5/8 dan sin B = 1/3, A di kuadran I dan B di kuadran II. Berilah tanda centang pada jawaban yang benar! (Jawaban dapat lebih dari satu)',t:'multi',o:['Nilai cos A = √39/8.','Nilai tan A = √39/8.','Nilai cos B = −(2/3)√2.','Nilai tan B = −(1/3)√3.','Nilai sec A = −√3.'],a:[0,2],e:['Cari sisi samping dengan Pythagoras. Untuk A: depan 5, miring 8, samping = √(64 − 25) = √39. Jadi cos A = √39/8 ✓ dan tan A = 5/√39 (bukan √39/8) ✗.','Untuk B: depan 1, miring 3, samping = √(9 − 1) = √8 = 2√2. Di kuadran II cosinus negatif: cos B = −2√2/3 ✓.','tan B = −1/(2√2) = −√2/4, bukan −√3/3 ✗. sec A = 8/√39 (positif), bukan −√3 ✗.']},
{g:'Statistika',q:'Diketahui data disajikan sebagai berikut.'+tb(['Berat (kg)','Frekuensi'],[['41 – 45',2],['46 – 50',4],['51 – 55',11],['56 – 60',13],['61 – 65',8],['66 – 70',2]])+'Berilah tanda centang pada jawaban yang benar! (Jawaban dapat lebih dari satu)',t:'multi',o:['Banyak datum ada 40.','Banyak kelas ada 6.','Panjang interval kelas adalah 5.','Tepi bawah kelas pertama adalah 40,5.','Tepi atas kelas pertama adalah 45.'],a:[0,1,2,3],e:['Banyak datum = jumlah frekuensi = 2 + 4 + 11 + 13 + 8 + 2 = 40 ✓. Banyak kelas ada 6 baris ✓.','Panjang interval = tepi atas − tepi bawah. Kelas 41–45 punya tepi 40,5 sampai 45,5, sehingga panjangnya 5 ✓ dan tepi bawah 40,5 ✓.','Tepi atas kelas pertama adalah 45,5, bukan 45 ✗.']},
{g:'Statistika',q:'Perhatikan data berikut.'+tb(['Nilai','Frekuensi'],[[6,6],[7,11],[8,10],[9,6],[10,5]])+'Banyak siswa dengan nilai di atas rata-rata ada ... siswa.',t:'mc',o:['11','17','21','24','32'],a:2,e:['Hitung banyak siswa: 6 + 11 + 10 + 6 + 5 = 38. Jumlah nilai: 6×6 + 7×11 + 8×10 + 9×6 + 10×5 = 36 + 77 + 80 + 54 + 50 = 297.','Rata-rata = 297/38 ≈ 7,82.','Nilai di atas 7,82 adalah 8, 9, dan 10. Banyak siswanya: 10 + 6 + 5 = 21.']},
{g:'Statistika',q:'Jangkauan antarkuartil dari data 1, 1, 2, 2, 3, 4, 6, 8, 10, 10, 10 adalah ....',t:'mc',o:['5','6','7','8','9'],a:3,e:['Ada 11 data terurut. Median (Q₂) adalah data ke-6, yaitu 4.','Bagian bawah (1, 1, 2, 2, 3): mediannya Q₁ = 2. Bagian atas (6, 8, 10, 10, 10): mediannya Q₃ = 10.','Jangkauan antarkuartil = Q₃ − Q₁ = 10 − 2 = 8.']},
{g:'Peluang',q:'Satu tim bola voli ada 16 pemain. Banyak cara memilih satu tim utama (6 orang) untuk bermain adalah ....',t:'mc',o:['1.008','2.124','2.348','7.244','8.008'],a:4,e:['Tim utama voli terdiri dari 6 orang, dan urutan tidak penting, jadi pakai kombinasi: C(16, 6).','C(16, 6) = (16 × 15 × 14 × 13 × 12 × 11)/(6 × 5 × 4 × 3 × 2 × 1).','Sederhanakan: = 5.765.760/720 = 8.008.']},
{g:'Peluang',q:'Dalam kotak ada bola hitam 5, putih 3, hijau 6, dan merah 4. Seseorang mengambil satu bola secara acak. Berilah tanda centang pada kolom Tepat atau Tidak Tepat!',t:'tf',h:['Tepat','Tidak Tepat'],o:['Peluang terambil bola hitam adalah 5/18.','Peluang terambil bola bukan hitam adalah 2/3.','Peluang terambil bola hijau adalah 1/6.','Peluang terambil bola bukan hijau adalah 2/3.','Peluang terambil bola merah adalah 2/9.'],a:[0,1,1,0,0],e:['Total bola = 5 + 3 + 6 + 4 = 18. Peluang = banyak yang diinginkan ÷ 18.','Hitam = 5/18 ✓. Bukan hitam = 13/18 (bukan 2/3) ✗. Hijau = 6/18 = 1/3 (bukan 1/6) ✗.','Bukan hijau = 12/18 = 2/3 ✓. Merah = 4/18 = 2/9 ✓.']},
{g:'Peluang',q:'Di atas meja terdapat seperangkat kartu bridge (52 kartu). Jika seseorang mengambil 2 kartu satu per satu tanpa pengembalian, peluang terambil keduanya kartu Jack hitam adalah ....',t:'mc',o:['1/41','2/221','1/221','1/442','1/1.326'],a:4,e:['Kartu Jack hitam ada 2 (Jack sekop dan Jack keriting) dari 52 kartu.','Pengambilan pertama: peluang 2/52. Karena tidak dikembalikan, tersisa 1 Jack hitam dari 51 kartu: peluang 1/51.','Kalikan: 2/52 × 1/51 = 2/2.652 = 1/1.326.']}
];
const TP=[];Q.forEach((q,i)=>{let x=TP.find(t=>t[0]==q.g);x?x[1].push(i+1):TP.push([q.g,[i+1]])});
let U={},i=0,ans=[],tl=T0,tid=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
function start(){clearInterval(tid);A.innerHTML=`<div class="hero"><i>TKA · SMA/MA dan SMK/MAK</i><h1>TRY OUT MATEMATIKA WAJIB TKA</h1></div><div class="front"><div class="meta"><span>📝 ${N} soal</span><span>⏱ 70 menit</span><span>🎯 Skor 0–800</span></div>
<h2>Data Peserta</h2><label for="nm">Nama siswa</label><input id="nm" autocomplete="off"><label for="kl">Kelas</label><input id="kl" autocomplete="off"><label for="sk">Asal sekolah</label><input id="sk" autocomplete="off">
<button class="btn" style="width:100%;margin-top:18px" onclick="go()">Mulai Try Out</button></div>
<div class="card"><h2>Petunjuk Pengerjaan</h2><ol style="margin:0;padding-left:20px"><li>Isi nama, kelas, dan asal sekolah, lalu tekan <b>Mulai Try Out</b>. Waktu 70 menit langsung berjalan.</li><li>Ada tiga jenis soal: <b>pilihan ganda</b> (pilih satu), <b>pilihan ganda kompleks</b> (centang satu atau lebih jawaban), dan <b>tabel</b> (pilih Benar/Salah atau Setuju/Tidak Setuju tiap pernyataan).</li><li>Soal kompleks dan tabel dinilai benar hanya jika <b>semua</b> pilihannya tepat. Tidak ada nilai minus untuk jawaban salah.</li><li>Gunakan tombol nomor untuk berpindah soal. Jawaban bisa diubah sebelum dikumpulkan.</li><li>Jika waktu habis, jawaban dikumpulkan otomatis. Setelah selesai tampil skor 0–800, kunci jawaban, dan pembahasan tiap soal.</li></ol></div>
<div class="card"><h2>Kisi-kisi Soal</h2><div class="scroll"><table><tr><th>Materi</th><th>Nomor soal</th><th class="c">Jumlah</th></tr>${TP.map(t=>`<tr><td>${t[0]}</td><td>${t[1].join(', ')}</td><td class="c">${t[1].length}</td></tr>`).join('')}<tr><td><b>Total</b></td><td></td><td class="c"><b>${N}</b></td></tr></table></div></div>`;scrollTo(0,0)}
function go(){U={n:$('#nm').value.trim(),k:$('#kl').value.trim(),s:$('#sk').value.trim()};if(!U.n||!U.k||!U.s)return alert('Lengkapi Nama, Kelas, dan Asal Sekolah dulu.');i=0;tl=T0;ans=Q.map(q=>q.t=='multi'?[]:q.t=='tf'?q.o.map(()=>null):null);clearInterval(tid);tid=setInterval(()=>{tl--;const t=$('#tt');if(t)t.textContent=fmt(tl);if(tl<=0){clearInterval(tid);alert('Waktu habis! Jawaban dikumpulkan otomatis.');res()}},1000);quiz()}
const has=j=>{const a=ans[j],q=Q[j];return q.t=='mc'?a!==null:q.t=='multi'?a.length>0:a.some(x=>x!==null)};
function quiz(){const q=Q[i],a=ans[i],dn=Q.filter((_,j)=>has(j)).length;let h=`<div class="tm"><span>⏱ Sisa waktu</span><span id="tt">${fmt(tl)}</span></div><div class="card"><div class="row"><span class="chip">Soal ${i+1}/${N} · ${q.g}</span><span style="color:var(--m);font-size:14px">${esc(U.n)}</span></div><div class="bar"><i style="width:${dn/N*100}%"></i></div><p>${q.q}</p>${FIG[i]?`<div class="fig">${FIG[i]}</div>`:''}`;
if(q.t=='mc')h+=q.o.map((o,j)=>`<div class="opt ${a===j?'s':''}" onclick="pick(${j})"><b>${L[j]}.</b><span>${o}</span></div>`).join('');
else if(q.t=='multi')h+='<p class="sub" style="text-align:left">Pilih satu atau lebih:</p>'+q.o.map((o,j)=>`<div class="opt ${a.includes(j)?'s':''}" onclick="pick(${j})"><input type="checkbox" ${a.includes(j)?'checked':''} tabindex="-1"><span>${o}</span></div>`).join('');
else h+=`<div class="scroll"><table><tr><th>Pernyataan</th><th class="c">${q.h[0]}</th><th class="c">${q.h[1]}</th></tr>${q.o.map((o,j)=>`<tr><td>${o}</td>${[0,1].map(c=>`<td class="c"><input type="radio" style="width:auto" name="r${j}" ${a[j]===c?'checked':''} onclick="pick(${j},${c})"></td>`).join('')}</tr>`).join('')}</table></div>`;
h+=`<div class="row" style="margin-top:14px"><button class="btn g" onclick="mv(-1)" ${i?'':'disabled'}>← Sebelumnya</button>${i<N-1?'<button class="btn" onclick="mv(1)">Berikutnya →</button>':'<button class="btn" onclick="fin()">Selesai &amp; Lihat Hasil</button>'}</div></div><div class="card"><h2>Navigasi Soal</h2><div class="nav">${Q.map((_,j)=>`<button class="${has(j)?'d':''} ${j==i?'cur':''}" onclick="i=${j};quiz()">${j+1}</button>`).join('')}</div><div style="margin-top:12px;text-align:right"><button class="btn g" onclick="fin()">Kumpulkan Jawaban</button></div></div>`;A.innerHTML=h;scrollTo(0,0)}
function pick(j,c){const q=Q[i];if(q.t=='mc')ans[i]=j;else if(q.t=='multi'){const a=ans[i],k=a.indexOf(j);k<0?a.push(j):a.splice(k,1)}else ans[i][j]=c;quiz()}
function mv(d){i+=d;quiz()}
const ok=j=>{const q=Q[j],a=ans[j];return q.t=='mc'?a===q.a:q.t=='multi'?[...a].sort().join()==q.a.join():a.every((x,k)=>x===q.a[k])};
const txt=(q,a)=>q.t=='mc'?(a===null?'(tidak dijawab)':L[a]+'. '+q.o[a]):q.t=='multi'?(a.length?'Pernyataan nomor '+[...a].sort().map(j=>j+1).join(', '):'(tidak dijawab)'):q.o.map((_,j)=>(j+1)+': '+(a[j]===null?'—':q.h[a[j]])).join(' · ');
const key=q=>q.t=='mc'?L[q.a]+'. '+q.o[q.a]:q.t=='multi'?'Pernyataan nomor '+q.a.map(j=>j+1).join(', '):q.o.map((_,j)=>(j+1)+': '+q.h[q.a[j]]).join(' · ');
const sh=e=>e.map((x,k)=>`<div class="st"><b>${k+1}</b><span>${x}</span></div>`).join('');
function fin(){const un=Q.filter((_,j)=>!has(j)).length;if(un&&!confirm(un+' soal belum dijawab. Tetap kumpulkan?'))return;res()}
function res(){clearInterval(tid);const s=Q.filter((_,j)=>ok(j)).length,n=Math.round(s/N*800),pr=n>=640?'Sangat baik! 🎉':n>=480?'Baik, terus tingkatkan! 👍':'Ayo belajar lagi, kamu pasti bisa! 💪';
let h=`<div class="card"><h1 style="text-align:center;color:var(--p)">Hasil Try Out Matematika Wajib TKA</h1><p class="sub">${esc(U.n)} · ${esc(U.k)} · ${esc(U.s)}</p><div class="sc">${n}</div><p class="sub">dari skala 0–800</p><p class="sub">Benar ${s} dari ${N} soal · Salah/kosong ${N-s}<br><b>${pr}</b></p><div class="row" style="justify-content:center"><button class="btn g" onclick="print()">🖨 Cetak / Simpan PDF</button><button class="btn g" onclick="start()">Ulangi</button></div></div>
<div class="card"><h2>Pembahasan Setiap Soal</h2><p class="sub" style="text-align:left">Kartu hijau = jawabanmu benar, merah = belum tepat. Baca langkah-langkahnya dari atas ke bawah.</p></div>`;
Q.forEach((q,j)=>{const g=ok(j);h+=`<div class="card rv ${g?'ok':'no'}"><span class="chip">Soal ${j+1} · ${q.g}</span> <b style="color:var(--${g?'ok':'no'})">${g?'✔ Jawabanmu benar':'✘ Jawabanmu belum tepat'}</b><p>${q.q}</p>${FIG[j]?`<div class="fig">${FIG[j]}</div>`:''}<div class="${g?'key':'bad'}">Jawabanmu: ${txt(q,ans[j])}</div><div class="key"><b>Kunci jawaban:</b> ${key(q)}</div><div class="tip"><b>💡 Konsep yang perlu kamu tahu</b><br>${TOPIC[q.g]}</div><div class="exp"><b>📖 Pembahasan langkah demi langkah</b>${sh(q.e)}<div class="st"><b>✓</b><span>Jadi jawabannya: <b>${key(q)}</b></span></div></div></div>`});
A.innerHTML=h;scrollTo(0,0)}
start();
</script></body></html>
